<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="style.css">
    <script src="js/login.js" defer></script>
    <script src="js/header-auth.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/translations.js" defer></script>
</head>
<body>
    <header class="head">
        <div class="head-left">
            <img class="logo" src="img/Wordmark.png" alt="">
        </div>    
        <div class="head-right">
            <span class="head-right-span"><a href="index.html" data-translate="main">Main</a></span>
            <span class="head-right-span"><a href="about.html" data-translate="about_us">About us</a></span>
            <span class="head-right-span"><a href="catalog.html" data-translate="flights">Flights</a></span>
            <select id="languageSelector" aria-label="Select language">
                <option value="en">EN</option>
                <option value="ru">RU</option>
            </select>
            
            <!-- Для авторизованных пользователей -->
            <div id="authenticatedUser" style="display: none;">
                <span class="head-right-span"><a href="#" id="cartLink">Cart</a></span>
                <span class="head-right-span"><a href="profile.html" id="profileLink">Profile</a></span>
                <span class="head-right-span"><a href="#" id="logoutLink">Logout</a></span>
            </div>
            
            <!-- Кнопка админ-панели (только для администраторов) -->
            <div id="adminPanel" style="display: none;">
                <span class="head-right-span"><a href="admin.html" id="adminLink">Admin Panel</a></span>
            </div>
            
            <!-- Для неавторизованных пользователей -->
            <div id="unauthenticatedUser">
                <span class="head-right-span" id="signInLink"><a href="login.html" data-translate="sign_in">Sign in</a></span>
                <button class="purple-button" id="signUpBtn" data-translate="sign_up">Sign up</button>
            </div>
        </div>
    </header>

    <main>
        <section class="auth-section">
            <div>
                <h2 data-translate="login_title">Log in</h2>
            </div>
            <form id="loginForm" class="auth-form">
                <div class="input-wrapper">
                    <input class="card-input" type="text" 
                           data-translate-placeholder="nickname" 
                           placeholder="Nickname" 
                           id="loginInput">
                    <span class="error-message" id="login-error"></span>
                </div>
                <div class="input-wrapper">
                    <input class="card-input" type="password" 
                           data-translate-placeholder="password" 
                           placeholder="Password" 
                           id="passwordInput">
                    <span class="error-message" id="password-error"></span>
                </div>
                <button type="submit" class="check-in-button" id="submit-button" data-translate="login_button">Log in</button>
                <h3><a href="registar.html" id="toggle-form" data-translate="switch_to_register">Sign up</a></h3>
            </form>
        </section>
    </main>
    
    <footer class="footer-container">
        <div class="footer-content">
            <div class="social-icons">
                <img src="img/twitter.png" alt="Twitter">
                <img src="img/instagram.png" alt="Instagram">
                <img src="img/facebook.png" alt="Facebook">
            </div>
            <span class="footer-span">© 2020 Tripma incorporated</span>
        </div>
    </footer>
</body>
</html>
